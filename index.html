<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعنا قريبًا</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Almarai', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        video.bg-video {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="%23fff"/></svg>') repeat;
            animation: twinkle 2s infinite;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
        }

        .countdown {
            font-size: 1.5em;
            margin: 30px 0;
            background: rgba(255,255,255,0.1);
            padding: 15px 30px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .asteroid {
            position: absolute;
            right: 10%;
            top: 50%;
            transform: translateY(-50%);
            width: 150px;
            height: 150px;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: translateY(-50%) rotate(0deg); }
            to { transform: translateY(-50%) rotate(360deg); }
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .social-links {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 20px;
        }

        .social-links a {
            color: #fff;
            font-size: 1.5em;
            transition: 0.3s;
        }

        .social-links a:hover {
            transform: scale(1.2);
            text-shadow: 0 0 15px #fff;
        }

        @media (max-width: 768px) {
            .asteroid {
                display: none;
            }
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="background.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <div class="stars"></div>

    <div class="container">
        <h1>الموقع قيد الإنشاء</h1>
        <p>نحن نعمل بجد لإطلاق موقعنا قريبًا</p>
        <div class="countdown">
            <span id="days">30</span> يومًا باقية
        </div>

        <div class="social-links">
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
        </div>
    </div>

    <script>
        // Countdown timer
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 30);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById('days').innerHTML = days;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
